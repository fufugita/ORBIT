# ORBIT CI: fmt, clippy, test, deny — on a plain runner, no GTK needed
# (the Tauri crate is excluded from the workspace default build).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No debuginfo on CI: artifacts shrink several-fold and linking gets
  # faster. Panic backtraces are not needed on CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Integration-test binaries relink the whole workspace each; the
  # incremental cache is dead weight on a one-shot runner.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install bubblewrap
        # The shell sandbox tests are real: they run bwrap and assert
        # confined writes succeed, /etc writes fail, and the network is
        # unreachable. Without bwrap they silently skip — which is fine
        # locally but hides regressions in CI.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build gate binaries
        run: cargo build -p orbit-cli -p orbit-mock-provider
      - name: disk before test
        run: df -h /
      - name: allow user namespaces
        # bwrap needs unprivileged user namespaces, which Ubuntu 24.04
        # runners restrict through AppArmor. Lift that for this job so the
        # sandbox tests run against a real sandbox instead of skipping. If
        # the key does not exist they still skip, with a printed reason.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: test
        # The whole workspace in one run. (The interrupt and sandbox tests
        # used to be fenced off because the job kept dying when they ran;
        # that was the test process signalling its whole user session via
        # `kill -TERM -<pgid>`, not the runner — fixed in the code.)
        run: cargo test --workspace
      - name: disk after test
        if: always()
        run: df -h /
      - name: deny
        run: |
          cargo install --locked cargo-deny >/dev/null 2>&1
          cargo deny check
        continue-on-error: true
