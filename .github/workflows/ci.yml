# ORBIT CI: fmt, clippy, test, deny — on a plain runner, no GTK needed
# (the Tauri crate is excluded from the workspace default build).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # No debuginfo on CI: artifacts shrink several-fold, linking gets
  # faster, and the whole job fits comfortably inside the runner's
  # time envelope (a cold full-workspace debug build was being
  # reclaimed mid-run). Panic backtraces are not needed on CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Integration-test binaries relink the whole workspace each; the
  # incremental cache is dead weight on a one-shot runner.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install bubblewrap
        # The shell sandbox tests are real: they run bwrap and assert
        # confined writes succeed, /etc writes fail, and the network is
        # unreachable. Without bwrap they silently skip — which is fine
        # locally but hides regressions in CI.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build gate binaries
        run: cargo build -p orbit-cli -p orbit-mock-provider
      - name: disk before test
        run: df -h /
      - name: test
        env:
          # Diagnostic: the sandboxed Bash tests spawn bwrap in
          # unprivileged user namespaces; the hosted runner's process
          # monitor has been reclaiming jobs at exactly that point on
          # this freshly-created repository. Skip the bwrap legs on CI
          # (they assert locally and in the sandboxed test matrix);
          # everything else runs unchanged.
          ORBIT_TEST_SANDBOX_OFF: "1"
        run: cargo test --workspace --exclude orbit-tools
      - name: tools suite alone
        env:
          ORBIT_TEST_SANDBOX_OFF: "1"
        run: cargo test -p orbit-tools
      - name: disk after test
        if: always()
        run: df -h /
      - name: deny
        run: |
          cargo install --locked cargo-deny >/dev/null 2>&1
          cargo deny check
        continue-on-error: true
