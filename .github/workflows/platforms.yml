name: native platforms

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/platform-first-run-*']
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - scripts/nixos_runtime_test.py
      - scripts/windows_native_test.ps1
      - scripts/in-jail.sh
      - .github/workflows/platforms.yml

permissions:
  contents: read

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nixos:
    if: github.ref != 'refs/heads/codex/platform-first-run-windows-proof-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          enable_kvm: true
          extra_nix_config: |
            max-jobs = 1
            cores = 2
      - name: Enable isolated user namespaces on the ephemeral runner
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          scripts/in-jail.sh true
      - name: Build exact source package
        id: package
        run: scripts/in-jail.sh nix build -L --no-write-lock-file --out-link result-package .#orbit
      - name: Run normal-user NixOS VM journey
        run: scripts/in-jail.sh nix build -L --no-write-lock-file --out-link result-vm .#checks.x86_64-linux.nixos-runtime
      - name: Retain package identity
        if: always()
        run: |
          mkdir -p platform-results
          nix flake metadata --json --no-write-lock-file > platform-results/flake.json
          if test '${{ steps.package.outcome }}' = success; then
            readlink -f result-package > platform-results/package-store-path
            sha256sum result-package/bin/orbit result-package/bin/orbit-web \
              result-package/bin/.orbit-wrapped result-package/bin/.orbit-web-wrapped \
              > platform-results/package.sha256
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nixos-package-identity
          path: platform-results/

  windows-foundation:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +1.99.0 --version
      - name: Run native private-storage contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force platform-results | Out-Null
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber |
            Format-List | Out-File platform-results/windows.txt
          whoami /all | Out-File platform-results/identity.txt
          # This isolated runner needs real short aliases for the reservation test.
          $fixtureDrive = [IO.Path]::GetPathRoot([IO.Path]::GetTempPath()).TrimEnd('\')
          fsutil 8dot3name set $fixtureDrive 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fsutil 8dot3name query $fixtureDrive | Out-File platform-results/ntfs-short-names.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 test --locked --no-fail-fast -p orbit-platform --lib --test windows_foundation -- --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath platform-results/windows-foundation.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          $report = Get-Content platform-results/windows-foundation.log -Raw
          $required = @(
            'ambiguous_components_are_rejected',
            'lock_namespace_is_reserved_consistently',
            'windows::unicode_private_create_reopen_and_read_bounds',
            'windows::absolute_drive_and_verbatim_aliases_keep_identity',
            'windows::held_root_and_ancestor_cannot_be_swapped',
            'windows::file_keeps_ancestor_handles_after_directory_drop',
            'windows::hardlinks_and_junctions_are_rejected',
            'windows::file_symlink_is_not_followed',
            'windows::permissive_dacl_is_rejected_by_held_and_reopened_checks',
            'windows::wrong_owner_is_rejected',
            'windows::publication_does_not_clobber_and_replace_retains_original',
            'windows::replacement_requires_expected_identity_and_exclusive_lock',
            'windows::exclusive_lock_excludes_other_processes_and_releases',
            'windows::missing_existing_lock_does_not_create_state',
            'windows::existing_lock_fixed_buffer_snapshot_and_cursor',
            'windows::file_snapshot_detects_content_change',
            'windows::existing_lock_rejects_nonempty_and_unsafe_without_repair',
            'windows::existing_only_locks_observe_cross_process_contention',
            'windows::shared_readers_coexist_but_exclude_writer',
            'fs::windows::tests::private_storage_works_without_admin_group_or_privileges',
            'fs::windows::tests::flush_failure_preserves_original_and_unpublished_candidate',
            'fs::windows::tests::prepublication_failure_restores_expected_original',
            'fs::windows::tests::postpublication_flush_failure_retains_original_backup',
            'fs::windows::tests::inspection_rechecks_acl_after_snapshot',
            'fs::windows::tests::inspection_revalidates_full_identity_after_replacement',
            'windows::inspection_empty_root_is_no_effect',
            'windows::source_directory_reads_public_unicode_file_without_private_authority',
            'windows::source_directory_rejects_replaced_full_identity',
            'windows::source_file_rejects_reads_over_the_requested_bound',
            'windows::inspection_observes_existing_shared_lock_and_nested_files',
            'windows::inspection_rejects_permissive_and_wrong_owner_entries_without_repair',
            'windows::inspection_rejects_reparse_and_hardlink_entries',
            'windows::inspection_limits_reject_extra_entry_path_and_depth_without_changes',
            'windows::inspection_holds_root_and_ancestors_while_walking',
            'windows::locked_update_has_explicit_cursor_append_length_and_truncate',
            'windows::lifecycle_rejects_wrong_identity_shared_and_foreign_guards',
            'windows::checked_backup_restore_and_cleanup_preserve_identity',
            'windows::restore_refuses_occupied_target_and_reparse_sources',
            'windows::enumeration_is_bounded_and_revalidates_entries',
            'windows::empty_child_cleanup_refuses_live_anchors_nonempty_and_wrong_identity',
            'windows::stable_lock_names_cannot_enter_data_mutation_routes',
            'fs::windows::tests::removal_faults_report_preserved_or_disposition_acknowledged_state',
            'fs::windows::tests::shared_reader_is_excluded_from_actual_two_rename_gap',
            'windows::published_candidate_cannot_be_republished_without_a_guard',
            'windows::ntfs_short_alias_cannot_bypass_reserved_lock_policy',
            'windows::simultaneous_publication_preserves_the_only_successful_name'
          )
          if ($required.Count -ne 46 -or @($required | Select-Object -Unique).Count -ne 46) {
            throw "Foundation's exact required-name manifest must contain 46 unique cases; found $($required.Count)"
          }
          foreach ($case in $required) {
            $pattern = '(?m)^test ' + [regex]::Escape($case) + ' \.\.\. ok\r?$'
            if ($report -notmatch $pattern) { throw "Required native case did not pass: $case" }
          }
          if ($report -match '\b[1-9][0-9]* ignored\b') { throw 'Native contracts were ignored' }
          @{ required_cases = $required.Count; status = 'passed'; source = '${{ github.sha }}' } |
            ConvertTo-Json | Out-File platform-results/windows-foundation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-foundation
          path: platform-results/

  windows-powershell:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove the initial native PowerShell capability tracer
        shell: pwsh
        run: ./scripts/windows_native_test.ps1 -Group Confinement
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-powershell-tracer
          path: platform-results/

  windows-registry-diagnostic:
    if: github.ref == 'refs/heads/codex/platform-first-run-windows-proof-20261105'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
      ORBIT_REGISTRY_DIAGNOSTIC_FIXTURE: github-hosted-fake-data-only-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure the private fake-data registry boundary
        shell: pwsh
        run: ./scripts/windows_native_test.ps1 -Group RegistryDiagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-registry-diagnostic
          path: platform-results/

  windows-registry-witness:
    if: github.ref == 'refs/heads/codex/platform-first-run-windows-proof-20261105'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
      ORBIT_REGISTRY_WITNESS_FIXTURE: github-hosted-fake-data-only-v1
      ORBIT_REGISTRY_WITNESS_NORMAL_CONTROLS: '37-v1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run 69 registry controls (cleanup remains incomplete)
        shell: pwsh
        run: ./scripts/windows_native_test.ps1 -Group RegistryWitness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-registry-witness
          path: platform-results/

  windows-host-capabilities:
    if: github.ref == 'refs/heads/codex/platform-first-run-windows-proof-20261105'
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Observe native isolation prerequisites without changing the host
        shell: pwsh
        run: ./scripts/windows_native_test.ps1 -Group HostCapabilities
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-host-capabilities
          path: platform-results/
