# ORBIT — Cargo workspace.
# Member crate list mirrors the accepted module map (DR-04..DR-14).
# The specification froze 2026-08-12; implementation follows the
# six-phase roadmap (docs/roadmap/).

[workspace]
resolver = "2"
# The Tauri desktop crate needs GTK system libraries, so it breaks
# `cargo test --workspace` on any machine (or CI runner) without them.
# It is excluded from the default build; build it explicitly with
# `cargo build -p orbit-desktop` on a machine with GTK.
exclude = ["fuzz", "crates/desktop/src-tauri"]
members = [
  "crates/frontend-protocol",
  "crates/engine",
  "crates/tools",
  "crates/reactor",
  "crates/sandbox",
  "crates/context",
  "crates/gateway",
  "crates/ledger",
  "crates/trust",
  "crates/session",
  "crates/pib",
  "crates/memory",
  "crates/export",
  "crates/plugin",
  "crates/egress",
  "crates/hud",
  "crates/hud-tui",
  "crates/cli",
  "crates/web",
  "crates/orbit-core",
  "crates/orbit-api",
  "crates/orbit-ledger",
  "crates/orbit-ir",
  "crates/release",
  "crates/adapter",
  "crates/provider-http",
  "crates/mock-provider",
  "migrator",
  "conformance",
  "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"          # pinned toolchain at release; see DR-13 §4.3
license = "Apache-2.0"         # core; shims dual (MIT OR Apache-2.0) per DR-13 §4
repository = "https://github.com/orbit-hq/orbit"
description = "ORBIT — the harness that orbits around you. User-authority orchestration with a strict proof/privacy kernel."

[workspace.dependencies]
# Phase-A baseline — permissive-only (DR-13 §5): MIT/Apache-2.0/BSD-3/ISC.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize = "1"
age = "0.12"
# age 0.12 uses rust-embed for localized error strings. Embed those assets in
# debug builds too; otherwise workspace builds resolve the relative i18n path
# from ORBIT's root and age error formatting can panic before returning E0508.
rust-embed = { version = "8", features = ["debug-embed"] }
toml = "0.8"
libc = "0.2"

# v0.2 async provider stack — permissive-only (DR-13 §5, re-checked via cargo-deny).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
async-trait = "0.1"
futures = "0.3"
axum = { version = "0.7", features = ["ws"] }
tokio-rustls = "0.26"
rcgen = "0.13"

# TUI stack (DR-20): ratatui + crossterm + signal handling.
ratatui = "0.30"
crossterm = "0.29"
signal-hook = "0.3"

# Grapheme-aware text shaping (DR-21 L14) — permissive (MIT/Unicode, MIT/Apache-2.0).
unicode-segmentation = "1.12"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Reproducible builds (DR-13 §4.3): SOURCE_DATE_EPOCH set in CI; do not add
# nondeterministic build metadata here.
