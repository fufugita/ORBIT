<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBIT</title>
<style>
/* ═══ ORBIT desktop foundations — docs/desktop/DESIGN.md ═══
   Tokens are canonical from the Foundations frame. */

:root {
  /* Surfaces */
  --canvas: #111015;
  --navigation: #15131A;
  --panel: #1B1821;
  --raised: #24202C;
  --hover: #2D2736;
  --pressed: #221E29;
  --code: #0D0C11;

  /* Text */
  --text-primary: #F5F2F7;
  --text-secondary: #C4BECF;
  --text-muted: #9B92A8;
  --text-disabled: #72697F;
  --on-brand: #1A1020;

  /* Brand */
  --brand: #F36BD6;
  --brand-hover: #FA89E0;
  --brand-pressed: #DB57BF;
  --focus-ring: #FFA0E8;
  --selection: #3A213B;

  /* Status */
  --live: #86CFE8;
  --success: #85D6AC;
  --warning: #E8BF7A;
  --error: #FF9A9F;
  --destructive: #AD2746;

  /* Borders */
  --border-subtle: #342D3D;
  --border-control: #85788F;

  /* Typography: Inter (UI+prose), JetBrains Mono (code) */
  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  /* Scale (px/line-height) */
  --fs-title: 20px; --lh-title: 28px;
  --fs-heading: 18px; --lh-heading: 26px;
  --fs-section: 16px; --lh-section: 24px;
  --fs-prose: 16px; --lh-prose: 26px;
  --fs-label: 14px; --lh-label: 20px;
  --fs-supporting: 13px; --lh-supporting: 20px;
  --fs-metadata: 12px; --lh-metadata: 18px;
  --fs-code: 13px; --lh-code: 20px;

  /* Layout */
  --top-bar-h: 48px;
  --status-footer-h: 28px;
  --nav-w: 232px;
  --inspector-w: 360px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--canvas);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--fs-prose);
  line-height: var(--lh-prose);
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-rows: var(--top-bar-h) 1fr var(--status-footer-h);
  grid-template-columns: var(--nav-w) 1fr;
  grid-template-areas:
    "topbar topbar"
    "nav main"
    "footer footer";
  height: 100vh;
}

/* ── Top bar (48px) ─────────────────────────────────────────── */
.top-bar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: var(--navigation);
  border-bottom: 1px solid var(--border-subtle);
}
.top-bar .mark {
  color: var(--brand);
  font-size: var(--fs-heading);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.top-bar .session-title {
  font-size: var(--fs-label);
  color: var(--text-secondary);
  font-weight: 500;
}
.top-bar .spacer { flex: 1; }
.top-bar .conn {
  font-size: var(--fs-metadata);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.top-bar .conn .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success);
}
.top-bar .conn.offline .dot { background: var(--error); }
.top-bar .conn.reconnecting .dot { background: var(--warning); }

/* ── Navigation (200–288px) ─────────────────────────────────── */
.nav {
  grid-area: nav;
  background: var(--navigation);
  border-right: 1px solid var(--border-subtle);
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
.nav .section-label {
  font-size: var(--fs-metadata);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 12px 8px 4px;
}
.nav .item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: var(--fs-label);
  color: var(--text-secondary);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.nav .item:hover { background: var(--hover); color: var(--text-primary); }
.nav .item.active {
  background: var(--selection);
  color: var(--text-primary);
}
.nav .item .glyph { width: 18px; text-align: center; color: var(--text-muted); }
.nav .item.active .glyph { color: var(--brand); }

/* ── Main: conversation lane ────────────────────────────────── */
.main {
  grid-area: main;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--canvas);
}
.conversation {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  scroll-behavior: smooth;
}
.conversation .inner {
  max-width: 760px;           /* reading measure ≤72ch/760px */
  margin: 0 auto;
  padding: 0 24px;
}

/* Turns — unboxed assistant prose, restrained user surface */
.turn { margin-bottom: 24px; }
.turn.user .bubble {
  background: var(--panel);
  border-radius: 10px;
  padding: 12px 16px;
  color: var(--text-primary);
}
.turn.assistant .prose {
  color: var(--text-primary);
  white-space: pre-wrap;
}
.turn .meta {
  font-size: var(--fs-metadata);
  color: var(--text-muted);
  margin-top: 4px;
}

/* Tool rows (streaming state) */
.tool-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  background: var(--panel);
  margin: 8px 0;
  font-size: var(--fs-supporting);
  color: var(--text-secondary);
}
.tool-row .glyph { color: var(--live); }
.tool-row .name { font-family: var(--font-mono); font-size: var(--fs-code); color: var(--text-primary); }
.tool-row .elapsed {
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  font-size: var(--fs-metadata);
}
.tool-row.failed .glyph { color: var(--error); }
.tool-row.done .glyph { color: var(--success); }

/* ── Composer ───────────────────────────────────────────────── */
.composer {
  border-top: 1px solid var(--border-subtle);
  padding: 16px 24px 20px;
  background: var(--canvas);
}
.composer .inner { max-width: 760px; margin: 0 auto; }
.composer textarea {
  width: 100%;
  min-height: 52px;
  max-height: 200px;
  resize: none;
  background: var(--panel);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 12px 16px;
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--fs-prose);
  line-height: var(--lh-prose);
  outline: none;
}
.composer textarea:focus { border-color: var(--focus-ring); }
.composer .actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}
.composer .send {
  background: var(--brand);
  color: var(--on-brand);
  border: none;
  border-radius: 6px;
  padding: 7px 18px;
  font-size: var(--fs-label);
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.composer .send:hover { background: var(--brand-hover); }
.composer .send:active { background: var(--brand-pressed); }
.composer .send:disabled { background: var(--text-disabled); cursor: default; }

/* ── Status footer (28px) ───────────────────────────────────── */
.status-footer {
  grid-area: footer;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: var(--navigation);
  border-top: 1px solid var(--border-subtle);
  font-size: var(--fs-metadata);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.status-footer .left { flex: 1; }
.status-footer .activity { color: var(--text-secondary); }
.status-footer .cost { color: var(--text-secondary); }

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width: 960px) {
  #app {
    grid-template-columns: 56px 1fr;
    --nav-w: 56px;
  }
  .nav .item span.label { display: none; }
  .nav .section-label { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top-bar">
    <span class="mark">✦ ORBIT</span>
    <span class="session-title" id="session-title">new session</span>
    <span class="spacer"></span>
    <span class="conn online" id="conn"><span class="dot"></span><span id="conn-text">online</span></span>
  </header>

  <nav class="nav" id="nav">
    <div class="section-label">Session</div>
    <button class="item active" data-pane="conversation">
      <span class="glyph">✦</span><span class="label">Conversation</span>
    </button>
    <button class="item" data-pane="workspace">
      <span class="glyph">◎</span><span class="label">Workspace</span>
    </button>
    <div class="section-label">View</div>
    <button class="item" data-pane="inspector">
      <span class="glyph">⌕</span><span class="label">Inspector</span>
    </button>
  </nav>

  <main class="main">
    <div class="conversation" id="conversation">
      <div class="inner" id="transcript">
        <div class="turn assistant">
          <div class="prose">The harness that orbits around you. Ask anything — the plan, findings, and verification land in the workspace as the turn runs.</div>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="inner">
        <textarea id="composer-input" placeholder="Ask ORBIT…" rows="2"></textarea>
        <div class="actions">
          <button class="send" id="send-btn" disabled>Send</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="status-footer">
    <span class="left"><span class="activity" id="activity">idle</span></span>
    <span id="tokens">↓0 ↑0</span>
    <span class="cost" id="cost">$0.0000</span>
  </footer>
</div>

<script>
// ── The protocol bridge ─────────────────────────────────────────
// Every FrontendEvent arrives as orbit://event; every FrontendAction
// leaves as an invoke. The vocabulary is orbit-frontend-protocol's.

const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const $ = (id) => document.getElementById(id);
const transcript = $('transcript');
const input = $('composer-input');
const sendBtn = $('send-btn');
const activity = $('activity');
const costEl = $('cost');
const tokensEl = $('tokens');

// ── Composer ────────────────────────────────────────────────────
input.addEventListener('input', () => {
  sendBtn.disabled = input.value.trim().length === 0;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) send();
  }
});
sendBtn.addEventListener('click', send);

function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  input.style.height = 'auto';
  appendTurn('user', text);
  invoke('send_action', {
    action: { type: 'prompt', text }
  }).catch(console.error);
}

// ── Rendering ───────────────────────────────────────────────────
function appendTurn(kind, text) {
  const div = document.createElement('div');
  div.className = 'turn ' + kind;
  if (kind === 'user') {
    div.innerHTML = '<div class="bubble"></div>';
    div.querySelector('.bubble').textContent = text;
  } else {
    div.innerHTML = '<div class="prose"></div>';
    div.querySelector('.prose').textContent = text;
  }
  transcript.appendChild(div);
  scrollToEnd();
}

function appendToolRow(name) {
  const div = document.createElement('div');
  div.className = 'tool-row';
  div.innerHTML = '<span class="glyph">◉</span><span class="name"></span><span class="elapsed">…</span>';
  div.querySelector('.name').textContent = name;
  transcript.appendChild(div);
  scrollToEnd();
  return div;
}

function scrollToEnd() {
  const conv = $('conversation');
  conv.scrollTop = conv.scrollHeight;
}

// ── Protocol events ─────────────────────────────────────────────
listen('orbit://event', (e) => {
  const ev = e.payload;
  switch (ev.type) {
    case 'text_delta': {
      // Append to the streaming turn (create if absent).
      let stream = transcript.querySelector('.turn.assistant.streaming .prose');
      if (!stream) {
        const div = document.createElement('div');
        div.className = 'turn assistant streaming';
        div.innerHTML = '<div class="prose"></div>';
        transcript.appendChild(div);
        stream = div.querySelector('.prose');
      }
      stream.textContent += ev.text;
      scrollToEnd();
      break;
    }
    case 'response_finished': {
      // Finalize the streaming turn.
      const stream = transcript.querySelector('.turn.assistant.streaming');
      if (stream) stream.classList.remove('streaming');
      activity.textContent = 'idle';
      tokensEl.textContent = `↓${fmt(ev.input_tokens)} ↑${fmt(ev.output_tokens)}`;
      break;
    }
    case 'tool_started': {
      appendToolRow(ev.name);
      activity.textContent = `running ${ev.name}`;
      break;
    }
    case 'tool_finished': {
      const rows = transcript.querySelectorAll('.tool-row');
      const last = rows[rows.length - 1];
      if (last) {
        last.classList.add(ev.ok ? 'done' : 'failed');
        last.querySelector('.glyph').textContent = ev.ok ? '✓' : '✕';
        last.querySelector('.elapsed').textContent = '';
      }
      break;
    }
    case 'cost_updated': {
      costEl.textContent = '$' + (ev.total_microcents / 1_000_000).toFixed(4);
      break;
    }
    case 'identity': {
      $('session-title').textContent = `${ev.model} · ${ev.session_id.slice(0, 6)}`;
      break;
    }
    case 'connection_changed': {
      const conn = $('conn');
      conn.className = 'conn ' + ev.state;
      $('conn-text').textContent = ev.state;
      break;
    }
    case 'error': {
      activity.textContent = 'error';
      activity.style.color = 'var(--error)';
      break;
    }
    case 'status': {
      activity.textContent = ev.text;
      break;
    }
  }
});

function fmt(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'm';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
  return String(n);
}

// ── Nav ─────────────────────────────────────────────────────────
document.querySelectorAll('.nav .item').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav .item').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Focus the composer on boot.
input.focus();
</script>
</body>
</html>
