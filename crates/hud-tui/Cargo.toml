# ORBIT orbit-hud-tui — TUI front-end (ratatui + crossterm)
# PURPOSE: Terminal user interface for ORBIT — three-pane layout, event-sourced,
#          display-safe, brand-aware. Contract: DR-20.
# Depends on orbit-hud (display gate, OutputMode, BrandTier, HudEvent).

[package]
name = "orbit-hud-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TUI front-end for ORBIT (ratatui + crossterm)"

[dependencies]
chrono.workspace = true
orbit-hud = { path = "../hud" }
ratatui.workspace = true
crossterm.workspace = true
toml.workspace = true
serde.workspace = true
signal-hook.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
# The terminal watchdog polls the input fd for POLLHUP/POLLERR without
# unsafe (the crate forbids it) — rustix::event::poll is safe Rust.
rustix.workspace = true

[lib]
name = "orbit_hud_tui"

[dev-dependencies]
serde_json.workspace = true
