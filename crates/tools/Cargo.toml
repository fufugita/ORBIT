[package]
name = "orbit-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orbit-adapter = { path = "../adapter" }
orbit-frontend-protocol = { path = "../frontend-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
ulid.workspace = true
url.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio.workspace = true
regex.workspace = true
ignore.workspace = true
toml = { workspace = true }
# Signals go through kill(2) itself (safe API, no `unsafe`): never through
# /usr/bin/kill, whose operand parsing is not safe for process groups.
rustix = { workspace = true, features = ["process"] }
