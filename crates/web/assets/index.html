<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIT</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%238be9fd' stroke-width='2'/%3E%3Ccircle cx='27' cy='10' r='3' fill='%238be9fd'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e6ecf3'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="logo">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="27" cy="10" r="3" fill="var(--accent)"/>
        <circle cx="16" cy="16" r="2.5" fill="var(--text)"/>
      </svg>
      <span>ORBIT</span>
    </div>
    <div id="statusbar">
      <span id="st-model" class="st">model —</span>
      <span id="st-provider" class="st">provider —</span>
      <span id="st-session" class="st">session —</span>
      <span id="st-cost" class="st">cost —</span>
      <span id="st-turns" class="st">turns —</span>
    </div>
    <div id="conn"><span id="conn-dot"></span><span id="conn-text">connecting</span></div>
  </header>

  <main id="panes">
    <aside id="sessions-pane">
      <h2>sessions</h2>
      <ul id="sessions-list"></ul>
      <div class="pane-foot">
        <button id="btn-refresh-sessions" title="refresh">⟳</button>
      </div>
    </aside>

    <section id="profile-area" hidden>
      <nav id="profile-tabs" role="tablist" aria-label="Workspace panes"></nav>
      <div id="profile-layout"></div>
    </section>

    <section id="chat-pane">
      <div id="transcript" aria-live="polite"></div>
      <div id="composer-wrap">
        <textarea id="composer" rows="2" placeholder="send a prompt — Enter to submit, Shift+Enter for newline"
                  autocomplete="off" spellcheck="false"></textarea>
        <button id="btn-send" title="send">▲</button>
        <button id="btn-cancel" title="cancel in-flight turn" hidden>■</button>
      </div>
    </section>

    <aside id="work-pane">
      <details id="customization-settings" hidden>
        <summary>Appearance and panes</summary>
        <div id="custom-controls">
          <label>Theme<select id="custom-theme" data-custom-write><option value="orbit">Orbit</option><option value="midnight">Midnight</option><option value="paper">Paper</option></select></label>
          <label>Spacing<select id="custom-density" data-custom-write><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label>
          <label>Symbols<select id="custom-glyphs" data-custom-write><option value="auto">Automatic</option><option value="unicode">Unicode</option><option value="ascii">ASCII</option></select></label>
          <label>Terminal color mode<select id="custom-mode" data-custom-write><option value="auto">Automatic</option><option value="truecolor">Full color</option><option value="256">256 colors</option><option value="16">16 colors</option><option value="mono">Monochrome</option></select></label>
          <label><input id="custom-motion" type="checkbox" data-custom-write> Reduce motion</label>
          <label>Browser font<input id="custom-font" type="text" maxlength="128" placeholder="monospace" data-custom-write></label>
          <label>Font size<input id="custom-font-size" type="number" min="10" max="24" step="0.5" data-custom-write></label>
          <button id="custom-font-apply" data-custom-write>Apply font</button>
          <label>Color role<input id="custom-color-key" value="ink" maxlength="64" data-custom-write></label>
          <label>Color<input id="custom-color" type="color" value="#eeeaF5" data-custom-write></label>
          <button id="custom-color-apply" data-custom-write>Apply color</button>
          <label>Layout<select id="custom-layout" data-custom-write><option value="columns">Columns</option><option value="build">Build</option><option value="agents">Agents</option><option value="review">Review</option><option value="custom" disabled>Custom</option></select></label>
          <details><summary>Custom layout and panes</summary>
            <label>Layout tree<textarea id="custom-tree" rows="4" maxlength="32768" data-custom-write></textarea></label>
            <button id="custom-tree-apply" data-custom-write>Apply layout</button>
            <label>Named panes<textarea id="custom-panes" rows="5" maxlength="65536" data-custom-write></textarea></label>
            <button id="custom-panes-apply" data-custom-write>Apply panes</button>
          </details>
          <label>Portable profile file<input id="custom-path" type="text" maxlength="256" placeholder="profile.json" data-custom-write></label>
          <div class="custom-actions"><button id="custom-validate" data-custom-write>Validate</button><button id="custom-import" data-custom-write>Import</button><button id="custom-export" data-custom-write>Export</button></div>
          <div class="custom-actions"><button id="custom-reload">Reload</button><button id="custom-reset" data-custom-write>Reset</button></div>
          <p id="custom-status" role="status" aria-live="polite"></p>
          <p id="custom-capabilities"></p>
        </div>
      </details>
      <h2>effort</h2>
      <div id="effort-controls">
        <label for="effort-select">Reasoning effort</label>
        <select id="effort-select" aria-describedby="effort-provenance effort-status"></select>
        <div id="effort-actions"><button id="effort-query">Refresh</button><button id="effort-reset">Use default</button></div>
        <p id="effort-provenance" aria-live="polite"></p>
        <p id="effort-status" aria-live="polite"></p>
      </div>
      <h2>activity</h2>
      <ul id="activity-list"></ul>
      <h2>usage</h2>
      <dl id="usage">
        <div><dt>input</dt><dd id="us-in">—</dd></div>
        <div><dt>output</dt><dd id="us-out">—</dd></div>
        <div><dt>cost</dt><dd id="us-cost">—</dd></div>
        <div><dt>turns</dt><dd id="us-turns">—</dd></div>
      </dl>
    </aside>
  </main>

  <div id="approval-modal" hidden>
    <div id="approval-card">
      <h3>approval required</h3>
      <div id="ap-tool"></div>
      <div id="ap-summary"></div>
      <div id="ap-actions">
        <button id="ap-allow" class="ok">y · allow once</button>
        <button id="ap-session" class="ok alt">R · allow session</button>
        <button id="ap-deny" class="no">n · deny</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
