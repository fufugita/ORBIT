<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIT</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%238be9fd' stroke-width='2'/%3E%3Ccircle cx='27' cy='10' r='3' fill='%238be9fd'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e6ecf3'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="logo">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="27" cy="10" r="3" fill="var(--accent)"/>
        <circle cx="16" cy="16" r="2.5" fill="var(--text)"/>
      </svg>
      <span>ORBIT</span>
    </div>
    <div id="statusbar">
      <span id="st-model" class="st">model —</span>
      <span id="st-provider" class="st">provider —</span>
      <span id="st-session" class="st">session —</span>
      <span id="st-cost" class="st">cost —</span>
      <span id="st-turns" class="st">turns —</span>
    </div>
    <div id="conn"><span id="conn-dot"></span><span id="conn-text">connecting</span></div>
  </header>

  <main id="panes">
    <aside id="sessions-pane">
      <h2>sessions</h2>
      <ul id="sessions-list"></ul>
      <div class="pane-foot">
        <button id="btn-refresh-sessions" title="refresh">⟳</button>
      </div>
    </aside>

    <section id="chat-pane">
      <div id="transcript" aria-live="polite"></div>
      <div id="composer-wrap">
        <textarea id="composer" rows="2" placeholder="send a prompt — Enter to submit, Shift+Enter for newline"
                  autocomplete="off" spellcheck="false"></textarea>
        <button id="btn-send" title="send">▲</button>
        <button id="btn-cancel" title="cancel in-flight turn" hidden>■</button>
      </div>
    </section>

    <aside id="work-pane">
      <h2>activity</h2>
      <ul id="activity-list"></ul>
      <h2>usage</h2>
      <dl id="usage">
        <div><dt>input</dt><dd id="us-in">—</dd></div>
        <div><dt>output</dt><dd id="us-out">—</dd></div>
        <div><dt>cost</dt><dd id="us-cost">—</dd></div>
        <div><dt>turns</dt><dd id="us-turns">—</dd></div>
      </dl>
    </aside>
  </main>

  <div id="approval-modal" hidden>
    <div id="approval-card">
      <h3>approval required</h3>
      <div id="ap-tool"></div>
      <div id="ap-summary"></div>
      <div id="ap-actions">
        <button id="ap-allow" class="ok">y · allow once</button>
        <button id="ap-session" class="ok alt">R · allow session</button>
        <button id="ap-deny" class="no">n · deny</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
