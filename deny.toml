# ORBIT cargo-deny policy (DR-13 §5 — permissive-only).
# Whitelist encodes the accepted v0.1 dependency policy:
#   Allowed: MIT, Apache-2.0, BSD-2/3, ISC, 0BSD, Unlicense, CC0-1.0 (data)
# Anything not allowlisted (incl. all copyleft) fails the check (default deny).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Any advisory (incl. yanked) fails the check.
yanked = "deny"
# Documented acceptances for advisories with no in-range fix (2026-11-02 audit).
ignore = [
    # RUSTSEC-2026-0374: basic-toml 0.1.10 is unmaintained (repo archived
    # 2025-03). Reachable only as a build-time config parser of
    # i18n-config/i18n-embed via age's fluent macro; not a runtime data path.
    # No replacement release exists; i18n-config 0.4.8 is the latest.
    "RUSTSEC-2026-0374",
    # RUSTSEC-2026-0387: crypto-bigint 0.5.5 constant-time variability.
    # Pulled by p256 0.13 via age 0.12 (hpke); orbit only uses age::x25519
    # (identity/recipient export sealing), never the p256 ECDSA operations
    # the advisory describes. crypto-bigint 0.7 is API-incompatible with
    # elliptic-curve 0.13; age 0.12.1 is the latest release.
    "RUSTSEC-2026-0387",
]
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # Apache-2.0 WITH LLVM-exception — permissive, standard for the Rust
    # toolchain/compiler-ecosystem crates (wasmtime/cranelift). Within DR-13 §5.
    "Apache-2.0 WITH LLVM-exception",
    # Zlib — permissive OSI license (foldhash, a wasmtime transitive dep).
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    # Unicode-3.0: permissive Unicode data license used by unicode-ident /
    # tinystr (ICU ecosystem). Not copyleft / source-available — within
    # DR-13 §5 permissive-only policy.
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Explicit copyleft / source-available ban (DR-13 §5).
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "MPL-2.0",
    "BUSL-1.1",
    "Elastic-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
