# Reference template; ORBIT does not directly load this TOML file.
# Replace the executable with an already installed stdio browser-MCP server.
# Choose arguments for your existing browser and isolated profile explicitly.
# Do not use package runners that download an executable at launch.
# Browser origin/file options configure that server; ORBIT policy still applies.

[mcp_json.servers.browser]
command = "/path/to/existing/browser-mcp-server"
args = ["--headless"]
enabled = true
tools = ["browser_navigate", "browser_snapshot", "browser_click", "browser_close"]
timeout_ms = 30000
initialize_timeout_ms = 5000

[settings_toml.permissions]
ask = ["mcp__browser__*"]

