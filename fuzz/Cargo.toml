[package]
name = "orbit-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

orbit-ir = { path = "../crates/orbit-ir" }
orbit-ledger = { path = "../crates/ledger" }
orbit-export = { path = "../crates/export" }
orbit-migrator = { path = "../migrator" }

[[bin]]
name = "ir_cbor"
path = "fuzz_targets/ir_cbor.rs"
test = false
doc = false

[[bin]]
name = "ledger_record"
path = "fuzz_targets/ledger_record.rs"
test = false
doc = false

[[bin]]
name = "export_restore"
path = "fuzz_targets/export_restore.rs"
test = false
doc = false

[[bin]]
name = "migrator"
path = "fuzz_targets/migrator.rs"
test = false
doc = false
