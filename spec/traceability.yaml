deferred_register:
- item: live Attested token verification
  target: v0.2
  why: DR-01 §17.3; attestation plumbing unbuilt.
- item: provider/deployment/region selection exposed to orchestrators
  target: v0.2
  why: DR-01 §17.4; breaks flat-string invariant I2.
- item: runtime model fallback / auto-escalation for subagents
  target: v0.2
  why: DR-01 §7; no fallback in v0.1.
- item: cross-org/federated trust roots + public marketplace
  target: v0.2
  why: DR-02 §1/§2.
- item: OCSP/CRL revocation infrastructure
  target: v0.2
  why: DR-02 §3; 10s cache+refresh is the v0.1 bound.
- item: Ledger entries signed by built-in HSM/TPM/operator-GPG key
  target: v0.2
  why: DR-01 §10; signatures optional/out-of-tree in v0.1.
- item: provider-side idempotent re-call guarantee
  target: v0.2
  why: DR-09 §7; verified idempotency only when profile+conformance prove it.
- item: WASI 0.3 async preemption
  target: v0.3
  why: DR-07; host abandonment is the v0.1 cancel mechanism.
- item: cloud/account-level memory synthesis (cross-chat fade)
  target: v0.2
  why: DR-02 §6; no cloud in v0.1.
- item: ORBIT-hosted cloud backup service
  target: never / v0.2 at earliest
  why: DR-02 §8; export is operator-owned and local.
- item: auto-routing subagents from prompt contents
  target: v0.2
  why: DR-01 §16; orchestrator declares model.
- item: speculative/ensemble execution
  target: v0.2
  why: DR-01 §16.
- item: provider health/status-page routing
  target: v0.2
  why: DR-09 §2.2.
- item: multi-region data-residency selection UI
  target: v0.2
  why: DR-01 §17.4; region pinned and auditable but not selected.
- item: Gateway hard budget reservations + mid-stream cost abort
  target: v0.2 (E10xx reserved)
  why: DR-01 §7; cost is attributed, not enforced, in v0.1.
- item: semantic cross-provider output normalization
  target: v0.2
  why: DR-09 §2.2; output is hashed without normalization in v0.1.
- item: lifecycle auto-migration policy
  target: v0.2
  why: DR-09 §12; replacement is informational in v0.1.
- item: universal provider cancellation guarantee
  target: v0.2
  why: DR-09 §2.2.
- item: Silent/automatic runtime fallback remains forbidden; user-granted FallbackPlan is a DR-14 v0.1 override, not an auto-fallback.
  target: DR-14 explicit grant path in v0.1; E1851 for ungranted source fallback
  rationale: Reconciles DR-11 §5.2 with DR-14 §4.
- item: Unallocated E19xx slots (E1915-E1919, E1924-E1929, E1933-E1939, E1950-E1999).
  target: reserved for additive authority errors at implementation freeze/v0.2
  rationale: Intentional gaps; E1946-E1949 allocated at pass 3 for policy store/nonce/token hardening.
- item: adapter_conformance_suite_per_profile (ORBIT-F-GW-006)
  target: implementation-phase M2
  why: Requires a real provider adapter + signed profile + conformance evidence (GW-24); no adapter implemented yet.
- item: credential_rotation_old_leases_finish_new_call_gets_new_version (ORBIT-F-GW-003)
  target: implementation-phase M2
  why: Requires real credential rotation with dispatch timing (GW-17); the immutable-lease invariant is unit-covered.
- item: dispatch_cannot_race_ahead_of_ledger_fsync_ack (ORBIT-F-GW-001)
  target: implementation-phase M2
  why: Requires a threaded broker + Ledger fsync-ACK timing test (GW-04); ordering is structurally enforced in the egress
    broker.
- item: dist_semver_compat_drop_in (ORBIT-F-DIST-003)
  target: release-gate
  why: Requires a real installed binary version pair; covered by the clean-machine E2E at build time.
- item: kill_in_flight_wasi_instance (ORBIT-F-SAND-006)
  target: implementation-phase M2 (WASI runtime binding)
  why: Requires the wasmtime host + instance pool reclaim timing (S11); pool bound is enforced in the plugin registry.
- item: retired_pinned_replay_requires_explicit_allow_and_never_substitutes (ORBIT-F-GW-005)
  target: implementation-phase M3 (replay engine)
  why: Requires the full replay engine; the double-lock + never-substitute semantics are in DR-06 §8.2 and the CLI double-lock
    path.
